<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Pattern for Grid Background -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.4"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
    }
    @keyframes nodeFloat1 {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-12px) translateX(8px); }
    }
    @keyframes nodeFloat2 {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(15px) translateX(-10px); }
    }
    @keyframes dashFlow {
      from { stroke-dashoffset: 200; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes pillPulse {
      0%, 100% { stroke-opacity: 0.4; }
      50% { stroke-opacity: 0.9; }
    }

    .bg-grid { opacity: 0.6; }
    .glow-orb-1 { animation: pulseGlow 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .glow-orb-2 { animation: pulseGlow 10s ease-in-out infinite 2s; transform-origin: 1000px 220px; }
    
    .anim-node-1 { animation: nodeFloat1 6s ease-in-out infinite; }
    .anim-node-2 { animation: nodeFloat2 7s ease-in-out infinite 1s; }
    .anim-line { stroke-dasharray: 8, 8; animation: dashFlow 20s linear infinite; }
    .tag-pill { animation: pillPulse 4s ease-in-out infinite; }
  </style>

  <!-- Base Card Surface -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>
  <rect width="1200" height="320" rx="16" fill="url(#gridPattern)" class="bg-grid"/>

  <!-- Dynamic Background Orbs & Flow (BEHIND TEXT) -->
  <g class="bg-dynamic">
    <!-- Glowing Orbs -->
    <circle class="glow-orb-1" cx="180" cy="80" r="140" fill="#0284c7" opacity="0.25" filter="url(#glow)"/>
    <circle class="glow-orb-2" cx="1020" cy="240" r="160" fill="#7c3aed" opacity="0.2" filter="url(#glow)"/>

    <!-- Neural Network Grid Lines (Background decoration) -->
    <g stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1.5" fill="none">
      <path d="M 800 60 L 950 120 L 1100 80 L 1050 220 L 900 240 Z" class="anim-line"/>
      <path d="M 950 120 L 1050 220 M 800 60 L 900 240 M 1100 80 L 900 240" />
    </g>

    <!-- Animated Nodes in Background -->
    <g class="anim-node-1">
      <circle cx="800" cy="60" r="5" fill="#38bdf8" filter="url(#softGlow)"/>
      <circle cx="1100" cy="80" r="6" fill="#c084fc" filter="url(#softGlow)"/>
      <circle cx="900" cy="240" r="5" fill="#818cf8" filter="url(#softGlow)"/>
    </g>
    <g class="anim-node-2">
      <circle cx="950" cy="120" r="7" fill="#34d399" filter="url(#softGlow)"/>
      <circle cx="1050" cy="220" r="5" fill="#f472b6" filter="url(#softGlow)"/>
    </g>
  </g>

  <!-- FOREGROUND CONTENT: Header Title, Subtitle, Badges (ALWAYS ON TOP) -->
  <g class="foreground-content" transform="translate(60, 0)">
    
    <!-- Top Category Label -->
    <g transform="translate(0, 52)">
      <rect x="0" y="0" width="210" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1"/>
      <text x="105" y="18" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">AWESOME AI &amp; MLOPS</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.5" filter="url(#softGlow)">
      Machine Learning &amp; AI Model Development
    </text>

    <!-- Subtitle -->
    <text x="0" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400" fill="#94a3b8">
      Curated Ecosystem of Enterprise SaaS Platforms, MLOps Infrastructure &amp; Open-Source AI Frameworks
    </text>

    <!-- Feature Pills / Tags (Cleanly placed at bottom of card) -->
    <g transform="translate(0, 215)">
      <!-- Pill 1: MLOps Platforms -->
      <g transform="translate(0, 0)">
        <rect width="155" height="34" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" class="tag-pill"/>
        <circle cx="18" cy="17" r="4" fill="#38bdf8"/>
        <text x="30" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">MLOps Platforms</text>
      </g>

      <!-- Pill 2: Model Training -->
      <g transform="translate(167, 0)">
        <rect width="150" height="34" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1.5" class="tag-pill"/>
        <circle cx="18" cy="17" r="4" fill="#818cf8"/>
        <text x="30" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Model Training</text>
      </g>

      <!-- Pill 3: Experiment Tracking -->
      <g transform="translate(329, 0)">
        <rect width="185" height="34" rx="8" fill="#0f172a" stroke="#c084fc" stroke-width="1.5" class="tag-pill"/>
        <circle cx="18" cy="17" r="4" fill="#c084fc"/>
        <text x="30" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Experiment Tracking</text>
      </g>

      <!-- Pill 4: Model Serving -->
      <g transform="translate(526, 0)">
        <rect width="145" height="34" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5" class="tag-pill"/>
        <circle cx="18" cy="17" r="4" fill="#34d399"/>
        <text x="30" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Model Serving</text>
      </g>

      <!-- Pill 5: LLM Fine-Tuning -->
      <g transform="translate(683, 0)">
        <rect width="160" height="34" rx="8" fill="#0f172a" stroke="#f472b6" stroke-width="1.5" class="tag-pill"/>
        <circle cx="18" cy="17" r="4" fill="#f472b6"/>
        <text x="30" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">LLM Fine-Tuning</text>
      </g>
    </g>

  </g>
</svg>
